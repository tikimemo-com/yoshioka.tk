<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThikiMemo - 地域安全情報共有プラットフォーム</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sawarabi+Mincho&display=swap">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
    
    <script src="script.js" defer></script>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>
<body class="dashboard-page">
    <header class="header">
        <div class="header-content">
            <a href="dashboard.html" class="logo">
                🚨 ThikiMemo
            </a>
            <nav class="nav-menu">
                <a href="report.html" class="nav-button">危険を報告</a>
                <a href="#" class="nav-button">マップ</a>
                <a href="#" class="nav-button">詳細</a>
                <a href="#" id="dashboard-login-button" class="cta-button">ログイン</a>
                <div id="account-avatar">
                    <img id="user-avatar-img" src="" alt="アカウントアバター">
                    <button id="logout-button" class="cta-button" style="display:none; margin-left:10px;">ログアウト</button>
                </div>
            </nav>
        </div>
    </header>
    <main class="dashboard-container">
        <section class="dashboard-summary">
            <div class="summary-card">
                <h3>総投稿数</h3>
                <span id="totalReports" class="stat-number">0</span>
            </div>
            <div class="summary-card">
                <h3>今週の投稿数</h3>
                <span id="thisWeek" class="stat-number">0</span>
            </div>
            <div class="summary-card">
                <h3>アクティブユーザー</h3>
                <span id="activeUsers" class="stat-number">0</span>
            </div>
            <div class="summary-card">
                <h3>解決済み件数</h3>
                <span id="resolvedIssues" class="stat-number">0</span>
            </div>
        </section>
        <section class="dashboard-map">
            <h2>リアルタイム危険情報マップ</h2>
            <div id="danger-map"></div>
        </section>
        <section class="dashboard-reports">
            <h2>最近の投稿</h2>
            <div id="report-list">
                </div>
        </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
    
    <script src="script.js" defer></script>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const dangerMap = L.map('danger-map').setView([36.377, 139.019], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(dangerMap);

            const db = firebase.firestore();
            const dangerMarkers = [];
            const reportListElement = document.getElementById('report-list');
            const typeLabel = {
                traffic: '交通',
                disaster: '災害',
                crime: '犯罪',
                infrastructure: 'インフラ'
            };

            updateDashboardMap();
            db.collection('reports').orderBy('timestamp', 'desc').limit(5).onSnapshot(snapshot => {
                reportListElement.innerHTML = '';
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const reportItem = document.createElement('div');
                    reportItem.className = 'report-item';
                    reportItem.innerHTML = `
                        <div class="report-header">
                            <span class="report-type">${typeLabel[data.type] || ''}</span>
                            <span class="report-time">${timeAgo(data.timestamp.toDate())}</span>
                        </div>
                        <p class="report-description">${data.description}</p>
                    `;
                    reportListElement.appendChild(reportItem);
                });
            });

            function updateDashboardMap() {
                db.collection('reports').get().then(snapshot => {
                    dangerMarkers.forEach(marker => marker.remove());
                    dangerMarkers.length = 0;
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        if (data.location && data.location.match(/^-?\d+(\.\d+)?,-?\d+(\.\d+)?$/)) {
                            const [lat, lng] = data.location.split(',').map(Number);
                            const typeIcon = {
                                traffic: '🚗',
                                disaster: '⚠️',
                                crime: '🔐',
                                infrastructure: '🏗️'
                            }[data.type] || '❓';
                            const marker = L.marker([lat, lng]).addTo(dangerMap);
                            marker.bindPopup(`
                                <div style="font-size:1rem;">
                                    <div>${typeIcon} <b>${typeLabel[data.type] || ''}</b></div>
                                    <div>${data.description || ''}</div>
                                    <div style="color:#888;font-size:0.9rem;">${data.location}</div>
                                </div>
                            `);
                            dangerMarkers.push(marker);
                        }
                    });
                });
            }

            // 相対時間表示
            function timeAgo(date) {
                const now = new Date();
                const diff = Math.floor((now - date) / 1000);
                if (diff < 60) return `${diff}秒前`;
                if (diff < 3600) return `${Math.floor(diff/60)}分前`;
                if (diff < 86400) return `${Math.floor(diff/3600)}時間前`;
                return `${date.getFullYear()}/${date.getMonth()+1}/${date.getDate()}`;
            }
        });
    </script>
</body>
</html>
